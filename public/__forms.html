<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Not shown to visitors. Netlify reads this file at deploy time to learn about the contact form.
     The real form lives in src/app/contact/ContactForm.tsx and posts here. Keep the field names in sync. -->
<form name="minorworks-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input type="text" name="name">
  <input type="email" name="email">
  <textarea name="message"></textarea>
  <input type="text" name="site">
</form>
</body>
</html>
